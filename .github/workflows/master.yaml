name: "Push to master branch"
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@master
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
      - run: go test ./...
